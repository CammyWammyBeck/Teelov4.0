services:
  teelo-update:
    build: .
    env_file:
      - .env
    command: ["python", "scripts/run_hourly_update.py", "--workers", "3"]
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    ports:
      - "5900:5900"
      - "6080:6080"
    restart: "no"

  update-current:
    build: .
    env_file:
      - .env
    # entrypoint lets extra args pass through: docker compose run --rm update-current --lookback-days 60
    entrypoint: ["python", "scripts/update_current_events.py"]
    command: ["--workers", "3"]
    volumes:
      - ./logs:/app/logs
    ports:
      - "5900:5900"
      - "6080:6080"
    restart: "no"

  teelo-backfill:
    build: .
    env_file:
      - .env
    command: ["python", "scripts/backfill_historical.py"]
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    ports:
      - "5900:5900"
      - "6080:6080"
    restart: "no"
