{% macro render_ranking_rows(players) %}
{% for p in players %}
<tr class="border-b border-line-subtle hover:bg-teelo-lime/10 transition-colors duration-75">
    <td class="px-4 py-2.5 text-sm text-content-faint font-bold tabular-nums text-right w-12">{{ p.rank }}</td>
    <td class="px-4 py-2.5">
        <a href="/players/{{ p.id }}" class="text-sm font-medium text-teelo-dark hover:underline decoration-teelo-lime decoration-2">{{ p.name }}</a>
        {% if p.nationality %}
        <span class="text-xs text-content-faint ml-1.5 font-mono">{{ p.nationality }}</span>
        {% endif %}
    </td>
    <td class="px-4 py-2.5 text-right font-bold text-sm tabular-nums text-teelo-dark">{{ p.rating }}</td>
    <td class="px-4 py-2.5 text-right text-sm text-content-faint tabular-nums hidden lg:table-cell">{{ p.career_peak }}</td>
    <td class="px-4 py-2.5 text-right text-sm text-content-faint tabular-nums hidden lg:table-cell">{{ p.match_count }}</td>
    <td class="px-4 py-2.5 text-right text-xs text-content-faint whitespace-nowrap hidden xl:table-cell">{{ p.last_match_display or '—' }}</td>
</tr>
{% endfor %}
{% endmacro %}
