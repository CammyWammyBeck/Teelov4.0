{% extends "base.html" %}

{% block title %}Search Results | Teelo Ratings{% endblock %}

{% block content %}
<div class="space-y-6">
  <section class="bg-white rounded-2xl shadow-soft border border-gray-100 p-5 md:p-6">
    <p class="text-xs uppercase tracking-wider text-gray-400 font-semibold mb-2">Search</p>
    <h1 class="text-3xl md:text-4xl font-extrabold text-teelo-dark tracking-tight">Search Results</h1>
    <div class="relative mt-4">
      <i data-lucide="search" class="w-5 h-5 text-gray-400 absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none"></i>
      <input
        id="search-results-input"
        type="search"
        value="{{ q or '' }}"
        placeholder="Search players, tournaments..."
        autocomplete="off"
        class="w-full h-12 md:h-14 pl-12 pr-4 rounded-xl border border-gray-200 bg-gray-50 text-base md:text-lg text-teelo-dark placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-teelo-lime/70 focus:border-transparent"
      >
    </div>
  </section>

  <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <div class="bg-white rounded-2xl shadow-soft border border-gray-100 p-5">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-teelo-dark">Players (<span id="search-results-players-count">0</span>)</h2>
      </div>
      <div id="search-results-players" class="space-y-3">
        <div class="rounded-xl border border-gray-100 bg-white p-6 text-sm text-gray-400">Loading…</div>
      </div>
    </div>

    <div class="bg-white rounded-2xl shadow-soft border border-gray-100 p-5">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-teelo-dark">Tournaments (<span id="search-results-tournaments-count">0</span>)</h2>
      </div>
      <div id="search-results-tournaments" class="space-y-3">
        <div class="rounded-xl border border-gray-100 bg-white p-6 text-sm text-gray-400">Loading…</div>
      </div>
    </div>
  </section>
</div>

<script type="module" src="{{ url_for('static', path='/js/search_results.js') }}"></script>
{% endblock %}
